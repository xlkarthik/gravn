packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts. Everything else is blocked.
allowBuilds:
  supabase: true
  esbuild: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.10'
  - '@expo/metro-config@58.0.14'
  - '@expo/package-manager@1.14.2'
  - '@expo/prebuild-config@58.0.14'
  - '@expo/router-server@58.0.14'
  - '@next/env@16.4.2'
  - '@next/eslint-plugin-next@16.4.2'
  - '@next/swc-darwin-arm64@16.4.2'
  - '@next/swc-darwin-x64@16.4.2'
  - '@next/swc-linux-arm64-gnu@16.4.2'
  - '@next/swc-linux-arm64-musl@16.4.2'
  - '@next/swc-linux-x64-gnu@16.4.2'
  - '@next/swc-linux-x64-musl@16.4.2'
  - '@next/swc-win32-arm64-msvc@16.4.2'
  - '@next/swc-win32-x64-msvc@16.4.2'
  - babel-preset-expo@58.0.16
  - eslint-config-next@16.4.2
  - expo-asset@58.0.16
  - expo-glass-effect@58.0.4
  - expo-image@58.0.15
  - expo-modules-core@58.0.20
  - expo-modules-jsi@58.0.14
  - expo-router@58.0.21
  - expo-system-ui@58.0.6
  - expo@58.0.12
  - next@16.4.2
  - react-native@0.88.0
